[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-video-engine"
version = "0.1.1"
description = "Isolated backend video engine for B2B video copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "moviepy>=1.0.3,<2.0.0",
  "mutagen>=1.47.0,<2.0.0",
  "requests>=2.32.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "tenacity>=8.2.0,<9.0.0",
]

[project.optional-dependencies]
packaging = [
  "pyinstaller>=6.0.0,<7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
